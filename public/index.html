<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Blaster Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; line-height: 1.5; }
    .card { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .qr-box { width: 150px; height: 150px; margin: 1rem auto; background #fff; border: 1px solid #ccc; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h2>WhatsApp Blaster Dashboard</h2>

  <!-- QR Code Connection -->
  <div class="card">
    <h3>Koneksi WhatsApp</h3>
    <div id="qr-box" class="qr-box"></div>
    <p id="status">Silakan scan QR code di atas dengan WhatsApp Anda.</p>
  </div>

  <!-- Upload DB Kontak -->
  <div class="card">
    <h3>Masukkan DB Kontak (CSV)</h3>
    <p>File harus berisi kolom 'no' atau 'number' dengan nomor internasional (contoh: 628xxxxxxxxxx).</p>
    <input type="file" id="dbFile" accept=".csv,.json" />
    <button onclick="uploadDB()">Muat ke DB</button>
  </div>

  <!-- Input Pesan -->
  <div class="card">
    <h3>Input Chat</h3>
    <textarea id="message" rows="3" placeholder="Tulis pesan disini..."></textarea>
    <input type="file" id="imageFile" accept="image/*" style="margin-top:0.5rem;" />
    <p style="font-size:0.8rem; margin-top:0.5rem;">Gambar opsional (ukuran kecil disarankan).</p>
  </div>

  <button onclick="sendMessages()" style="background:#25D366; color:white; border:none; padding:0.75rem 1.5rem; font-size:1rem;">
    Kirim Semua Pesan
  </button>

  <div id="result" style="margin-top:1rem; font-size:0.9rem;"></div>

  <script>
    const qrBox = document.getElementById('qr-box');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    // Poll for QR code every 3 seconds
    async function loadQR() {
      const res = await fetch('/qr');
      const data = await res.json();
      if (data.qr) {
        qrBox.innerHTML = '<img src="data:image/png;base64,' + data.qr + '" style="width:100%;height:100%;" />';
        status.textContent = 'Scan QR code di atas';
      } else if (data.status) {
        status.textContent = data.status;
        qrBox.innerHTML = '';
      }
    }
    setInterval(loadQR, 3000);
    loadQR();

    // Upload DB
    async function uploadDB() {
      const file = document.getElementById('dbFile').files[0];
      if (!file) return alert('Pilih file terlebih dahulu');
      const form = new FormData();
      form.append('file', file);
      try {
        const res = await fetch('/upload-db', { method: 'POST', body: form });
        const data = await res.json();
        if (data.success) {
          contacts = data.contacts;
          result.textContent = '✅ ' + contacts.length + ' nomor dimuat ke DB';
        } else {
          result.textContent = '❌ ' + data.error;
        }
      } catch (e) {
        result.textContent = '❌ Gagal upload';
        console.error(e);
      }
    }

    // Send messages
    async function sendMessages() {
      const msg = document.getElementById('message').value.trim();
      if (!msg) return alert('Masukkan pesan');
      if (!client) return alert('Baileys belum terhubung');
      result.textContent = '🔄 Sedang mengirim...';
      const form = new FormData();
      form.append('message', msg);
      const imgFile = document.getElementById('imageFile').files[0];
      if (imgFile) form.append('image', imgFile);
      try {
        const res = await fetch('/send', { method: 'POST', body: form });
        const data = await res.json();
        result.textContent = data.status ? '✅ ' + data.sent + ' terkirim, ' + data.failed + ' gagal' : '❌ ' + data.error;
      } catch (e) {
        result.textContent = '❌ Error kirim';
        console.error(e);
      }
    }
  </script>
</body>
</html>
